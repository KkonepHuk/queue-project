openapi: 3.0.3
info:
  title: Queue Service API
  version: 1.0.0
  description: API for queue management system

servers:
  - url: /api/v1
    description: Main API server

security:
  - bearerAuth: []

paths:

  /users/register:
    post:
      tags: [User]
      summary: Register user
      description: Create new user account
      security: []
      requestBody:
        description: Registration data
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'

  /users/login:
    post:
      tags: [User]
      summary: Login
      description: Authenticate user
      security: []
      requestBody:
        description: Login credentials
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLoginRequest'
      responses:
        '200':
          description: Auth success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'

  /users/me:
    get:
      tags: [User]
      summary: Get current user
      description: Returns current authenticated user
      responses:
        '200':
          description: User data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'

    patch:
      tags: [User]
      summary: Update current user
      description: Update user profile fields
      requestBody:
        description: Fields to update
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'

    delete:
      tags: [User]
      summary: Deactivate user
      description: Soft delete user
      responses:
        '204':
          description: User deactivated

  /groups:
    get:
      tags: [Group]
      summary: Get groups
      description: Returns list of groups
      responses:
        '200':
          description: Group list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GroupResponse'

    post:
      tags: [Group]
      summary: Create group
      description: Create new group
      requestBody:
        description: Group data
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupRequest'
      responses:
        '201':
          description: Group created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupResponse'

  /groups/{group_id}:
    get:
      tags: [Group]
      summary: Get group
      description: Get group by ID
      parameters:
        - name: group_id
          in: path
          required: true
          description: Group ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Group data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupResponse'

    patch:
      tags: [Group]
      summary: Update group
      description: Update group data
      parameters:
        - name: group_id
          in: path
          required: true
          description: Group ID
          schema:
            type: string
            format: uuid
      requestBody:
        description: Updated data
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupRequest'
      responses:
        '200':
          description: Updated group
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupResponse'

    delete:
      tags: [Group]
      summary: Delete group
      description: Remove group
      parameters:
        - name: group_id
          in: path
          required: true
          description: Group ID
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted

  /groups/{group_id}/members:
    get:
      tags: [GroupMember]
      summary: Get members
      description: Get group members
      parameters:
        - name: group_id
          in: path
          required: true
          description: Group ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Members list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GroupMemberResponse'

    post:
      tags: [GroupMember]
      summary: Add member
      description: Add user to group
      parameters:
        - name: group_id
          in: path
          required: true
          description: Group ID
          schema:
            type: string
            format: uuid
      requestBody:
        description: Member data
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupMemberRequest'
      responses:
        '201':
          description: Member added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupMemberResponse'

  /groups/{group_id}/members/{user_id}:
    patch:
      tags: [GroupMember]
      summary: Change role
      description: Update member role
      parameters:
        - name: group_id
          in: path
          required: true
          description: Group ID
          schema:
            type: string
            format: uuid
        - name: user_id
          in: path
          required: true
          description: User ID
          schema:
            type: string
            format: uuid
      requestBody:
        description: Role update
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GroupMemberRoleUpdateRequest'
      responses:
        '200':
          description: Updated member
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GroupMemberResponse'

    delete:
      tags: [GroupMember]
      summary: Remove member
      description: Remove user from group
      parameters:
        - name: group_id
          in: path
          required: true
          description: Group ID
          schema:
            type: string
            format: uuid
        - name: user_id
          in: path
          required: true
          description: User ID
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Removed

  /groups/{group_id}/queues:
    get:
      tags: [Queue]
      summary: Get queues
      description: Get queues in group
      parameters:
        - name: group_id
          in: path
          required: true
          description: Group ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Queue list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QueueResponse'

    post:
      tags: [Queue]
      summary: Create queue
      description: Create new queue
      parameters:
        - name: group_id
          in: path
          required: true
          description: Group ID
          schema:
            type: string
            format: uuid
      requestBody:
        description: Queue data
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueueRequest'
      responses:
        '201':
          description: Queue created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueResponse'

  /queues/{queue_id}:
    get:
      tags: [Queue]
      summary: Get queue
      description: Get queue by ID
      parameters:
        - name: queue_id
          in: path
          required: true
          description: Queue ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Queue data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueResponse'

    patch:
      tags: [Queue]
      summary: Update queue
      description: Update queue
      parameters:
        - name: queue_id
          in: path
          required: true
          description: Queue ID
          schema:
            type: string
            format: uuid
      requestBody:
        description: Updated data
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueueRequest'
      responses:
        '200':
          description: Updated queue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueResponse'

    delete:
      tags: [Queue]
      summary: Delete queue
      description: Delete queue
      parameters:
        - name: queue_id
          in: path
          required: true
          description: Queue ID
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Deleted

  /queues/{queue_id}/join:
    post:
      tags: [QueueEntry]
      summary: Join queue
      description: Add current user to queue
      parameters:
        - name: queue_id
          in: path
          required: true
          description: Queue ID
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Joined

  /queues/{queue_id}/leave:
    delete:
      tags: [QueueEntry]
      summary: Leave queue
      description: Remove current user from queue
      parameters:
        - name: queue_id
          in: path
          required: true
          description: Queue ID
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Left

  /queues/{queue_id}/entries:
    get:
      tags: [QueueEntry]
      summary: Get entries
      description: Get queue entries
      parameters:
        - name: queue_id
          in: path
          required: true
          description: Queue ID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Entries list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/QueueEntryResponse'

  /queues/{queue_id}/entries/{user_id}:
    patch:
      tags: [QueueEntry]
      summary: Update entry
      description: Update queue entry status
      parameters:
        - name: queue_id
          in: path
          required: true
          description: Queue ID
          schema:
            type: string
            format: uuid
        - name: user_id
          in: path
          required: true
          description: User ID
          schema:
            type: string
            format: uuid
      requestBody:
        description: Status update
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueueEntryUpdateRequest'
      responses:
        '200':
          description: Updated entry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueEntryResponse'

  /notifications:
    get:
      tags: [Notification]
      summary: Get notifications
      description: Get current user notifications
      responses:
        '200':
          description: Notification list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotificationResponse'

  /notifications/{id}/read:
    patch:
      tags: [Notification]
      summary: Mark as read
      description: Mark notification as read
      parameters:
        - name: id
          in: path
          required: true
          description: Notification ID
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Updated

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:

    UserRegistrationRequest:
      type: object
      description: User registration data
      required: [email, password, first_name, last_name]
      properties:
        email:
          type: string
        password:
          type: string
        first_name:
          type: string
        last_name:
          type: string

    UserLoginRequest:
      type: object
      description: Login credentials
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    AuthResponse:
      type: object
      description: JWT token
      properties:
        token:
          type: string

    UserResponse:
      type: object
      description: User info
      properties:
        user_id:
          type: string
          format: uuid
        email:
          type: string
        first_name:
          type: string
        last_name:
          type: string
        role:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time

    UserUpdateRequest:
      type: object
      description: Updatable fields
      properties:
        first_name:
          type: string
        last_name:
          type: string

    GroupRequest:
      type: object
      description: Group data
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string

    GroupResponse:
      type: object
      description: Group info
      properties:
        group_id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time

    GroupMemberRequest:
      type: object
      description: Add member
      required: [user_id, role]
      properties:
        user_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [OWNER, MODERATOR, MEMBER]

    GroupMemberRoleUpdateRequest:
      type: object
      description: Update role
      properties:
        role:
          type: string
          enum: [OWNER, MODERATOR, MEMBER]

    GroupMemberResponse:
      type: object
      description: Member info
      properties:
        user_id:
          type: string
          format: uuid
        role:
          type: string

    QueueRequest:
      type: object
      description: Queue data
      required: [title, event_date, reg_open, reg_close, max_size]
      properties:
        title:
          type: string
        description:
          type: string
        event_date:
          type: string
          format: date-time
        reg_open:
          type: string
          format: date-time
        reg_close:
          type: string
          format: date-time
        max_size:
          type: integer

    QueueResponse:
      type: object
      description: Queue info
      properties:
        queue_id:
          type: string
          format: uuid
        group_id:
          type: string
          format: uuid
        created_by:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
        event_date:
          type: string
          format: date-time
        reg_open:
          type: string
          format: date-time
        reg_close:
          type: string
          format: date-time
        max_size:
          type: integer
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time

    QueueEntryResponse:
      type: object
      description: Queue entry
      properties:
        user_id:
          type: string
          format: uuid
        position:
          type: integer
        status:
          type: string
          enum: [WAITING, PASSED, SKIPPED]
        joined_at:
          type: string
          format: date-time

    QueueEntryUpdateRequest:
      type: object
      description: Update entry
      properties:
        status:
          type: string
          enum: [WAITING, PASSED, SKIPPED]

    NotificationResponse:
      type: object
      description: Notification info
      properties:
        notification_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        queue_id:
          type: string
          format: uuid
        type:
          type: string
          enum: [SYSTEM, QUEUE]
        message:
          type: string
        status:
          type: string
          enum: [PENDING, SENT, READ]
        scheduled_at:
          type: string
          format: date-time
        sent_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time