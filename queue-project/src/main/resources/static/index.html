<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>welcome page</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form class="form" id="loginForm">
        <div class="title">Welcome to QApp</div>
        <div class="input-success" id="regSuccessMsg"></div>
        <div class="input-error" id="loginError"></div>
        <div>
            <label id="email">
                <input type="email" autocomplete="email">
                <span>Email</span>
            </label>
            <div class="input-error">invalid email</div>
        </div>
        <label id="password">
            <input type="password" autocomplete="current-password">
            <span>Password</span>
        </label>
        <div class="form-actions">
            <button type="submit" class="button primary disable">Log in</button>
            <a href="/register" class="button secondary">Sign Up</a>
        </div>
    </form>

    <script type="module" src="script.js"></script>
</body>
</html>
