services:
  postgres:
    image: postgres:17
    container_name: queue_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: queue_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - queue-network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: queue_project_app
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/queue_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      JWT_SECRET: queue-project-app-2026-super-secure-secret-key-minimum-64-character-never-share-this!!!
      JWT_EXPIRATION: 86400000
      JWT_HEADER: Authorization
      JWT_PREFIX: "Bearer "
    ports:
      - "8080:8080"
    networks:
      - queue-network

volumes:
  postgres_data:

networks:
  queue-network:
    driver: bridge